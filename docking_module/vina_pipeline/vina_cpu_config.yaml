paths:
  receptor_pdbqt: ""  # Optional pre-prepared receptor PDBQT.
  receptor_pdb: "/path/to/raw_receptor.pdb"  # Required when receptor_pdbqt is blank.
  ligand_dir: "/path/to/ligands"  # Required directory of ligand PDBQT files.
  output_dir: "/path/to/output"  # Required.
  target_residues_file: "./interface_residues.csv"  # Required only for an auto box.
  pocket_definition: null  # Optional ANTIOCH-VS best-pocket YAML; overrides box.center and box.size.

box:
  center: "auto"
  size: "auto"
  padding: [0, 0, 15.0]
  target_chain: "A"

docking:
  cpu: 32
  exhaustiveness: 40
  num_modes: 10
  min_rmsd: 3
  energy_range: 3
  scoring: "vina"

environment:
  mamba_env: "docking_pipeline"
  mamba_exe: "micromamba"
  vina_exe: "vina"  # Native executable or an absolute .sif image path.
  vina_cmd: "vina"  # Command inside a .sif image.
  singularity_binds: []
