paths:
  receptor_dms: "/path/to/receptor_surf_d5.dms"  # default in code: null; required; Generated from Chimera Pipeline
  receptor_mol2: "/path/to/receptor_wH_wcH.mol2"  # default in code: null; required; Generated from Chimera Pipeline
  ref_ligand_mol2: "/path/to/crystal_ligand.mol2"  # default in code: null; required; Used to select binding site spheres
  pocket_definition: null  # optional ANTIOCH-VS best-pocket YAML; replaces ref_ligand_mol2 with a pseudo-ligand at box.center
  ligand_file: "/path/to/ligands_to_dock.mol2"  # default in code: null; required; Single .mol2 or multi-mol2 library
  output_dir: "/path/to/dock6_output"  # default in code: null; required

parameters:
  sphere_radius: 15.0  # default in code: 15.0
  box_margin: 8.0  # default in code: 8.0
  max_orientations: 1000  # default in code: 1000
  # Optional: require every orientation to use a sphere near a particular part of the site
  # (see "Restricting Orientations to Part of the Site" in docking_module/README.md).
  # One mapping is one cluster; a list gives several, and a pose must then satisfy all of them.
  # Give exactly one of: selection (+ optional reference), points, center.
  critical_spheres: null  # e.g. {selection: "resid 930 932 and name N O"}
  critical_radius: 3.0  # default in code: 3.0; Å from the named atoms to a sphere centre

environment:
  # Native mode: absolute path to the host DOCK6 installation folder.
  # Singularity mode: path to the DOCK6 installation inside the image.
  dock6_dir: "/path/to/dock6"  # default in code: /usr/local/dock6

  # Uncomment to run all DOCK6 commands from a Singularity image.
  # sif_image: "/absolute/path/to/dock6.sif"
  # singularity_binds:
  #   - "/absolute/path/to/project"

  # Commands exposed inside the image. These original names are the defaults,
  # so this section is only needed when an image uses different command names.
  # container_commands:
  #   sphgen: "sphgen"
  #   sphere_selector: "sphere_selector"
  #   showbox: "showbox"
  #   grid: "grid"
  #   dock6: "dock6"

  # Optional MPI support for the final flexible-docking step only.
  # Request Slurm tasks, not only CPUs-per-task, for example:
  #   #SBATCH --ntasks=32
  #   #SBATCH --cpus-per-task=1
  # dock6_launcher: "srun --mpi=pmix -n ${SLURM_NTASKS}"
  # dock6_executable: "/absolute/path/to/dock6/bin/dock6.mpi"
