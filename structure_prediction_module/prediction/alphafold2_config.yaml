paths:
  sequence_file: "/path/to/query.fasta"
  output_dir: "/path/to/alphafold2_output"

environment:
  apptainer_executable: "apptainer"
  container_image: "/path/to/alphafold2.sif"
  data_dir: "/path/to/af2_databases"
  use_gpu: true
  input_mount: "/input"
  output_mount: "/output"
  data_mount: "/data"
  extra_binds: []

execution:
  overwrite: false
  # Optional path. Relative paths are placed under output_dir.
  log_file: null

alphafold2:
  runner_path: "/app/alphafold/run_alphafold.py"
  settings:
    max_template_date: "2026-01-01"
    db_preset: "reduced_dbs"
    model_preset: "monomer"
    use_gpu_relax: true
    small_bfd_database_path: "/data/small_bfd/bfd-first_non_consensus_sequences.fasta"
    uniref90_database_path: "/data/uniref90/uniref90.fasta"
    mgnify_database_path: "/data/mgnify/mgy_clusters_2022_05.fa"
    template_mmcif_dir: "/data/pdb_mmcif/mmcif_files"
    obsolete_pdbs_path: "/data/pdb_mmcif/obsolete.dat"
    pdb70_database_path: "/data/pdb70/pdb70"

# Entries may override any AlphaFold 2 setting supported by the installed
# container, for example random_seed or max_template_date. Each entry writes to
# output_dir/runs/<name>/. Native AlphaFold 2 installations may not support
# selecting individual model names.
runs:
  - name: "default"
    settings: {}
    extra_args: []
