paths:
  receptor_dms: "test_files/docking_module_test/dock6_dude_examples/abl1/prepared/2hzi_receptor_prepared_surf_d5.dms"  # default in code: null; required
  receptor_mol2: "test_files/docking_module_test/dock6_dude_examples/abl1/prepared/2hzi_receptor_prepared_wH_wcH.mol2"  # default in code: null; required
  ref_ligand_mol2: "test_files/docking_module_test/dock6_dude_examples/abl1/prepared/2hzi_JIN_reference_ligand.mol2"  # default in code: null; required
  ligand_file: "test_files/docking_module_test/dock6_dude_examples/abl1/prepared/2hzi_JIN_ligand.mol2"  # default in code: null; required
  output_dir: "test_files/docking_module_test/dock6_dude_examples/abl1/dock6_run"  # default in code: null; required

parameters:
  sphere_radius: 10.0  # default in code: 10.0
  box_margin: 8.0  # default in code: 8.0
  max_orientations: 1000  # default in code: 1000

environment:
  # Native mode: absolute path to the host DOCK6 installation folder.
  # Singularity mode: path to the DOCK6 installation inside the image.
  dock6_dir: "/path/to/dock6"  # default in code: /usr/local/dock6

  # Uncomment for Singularity/Apptainer execution.
  # sif_image: "/absolute/path/to/dock6.sif"
  # singularity_binds:
  #   - "/absolute/path/to/project_or_storage"

  # Optional MPI support for the final flexible-docking step only.
  # Request Slurm tasks for MPI, for example --ntasks=32 --cpus-per-task=1.
  # dock6_launcher: "srun --mpi=pmix -n ${SLURM_NTASKS}"
  # dock6_executable: "/absolute/path/to/dock6/bin/dock6.mpi"
